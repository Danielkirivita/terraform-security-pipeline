name: Terraform Security Gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    name: IaC Security Scan
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Scan deployable infrastructure
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: 'v0.75.0'
          scan-type: 'config'
          scan-ref: 'infra'
          severity: 'HIGH,CRITICAL'
          format: 'table'
          exit-code: '1'

      - name: Verify vulnerable fixture is detected
        shell: bash
        run: |
          set +e
          trivy config --severity HIGH,CRITICAL --exit-code 1 fixtures/vulnerable
          result=$?
          set -e
          if [ "$result" -ne 1 ]; then
            echo "Regression test failed: expected blocked fixture"
            exit 1
          fi
          echo "PASS: Vulnerable fixture was blocked"